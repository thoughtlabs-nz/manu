    turn_off_action:
      - lambda: |-
          id(bird_camera).set_horizontal_mirror(false);
          id(bird_camera).update_camera_parameters();
    web_server:
      sorting_group_id: group_orientation
      sorting_weight: 2

  - platform: template
    id: cam_auto_exposure
    name: Auto Exposure
    icon: mdi:camera-iris
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(bird_camera).set_aec_mode(esp32_camera::ESP32_GC_MODE_AUTO);
          id(bird_camera).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(bird_camera).set_aec_mode(esp32_camera::ESP32_GC_MODE_MANU);
          id(bird_camera).update_camera_parameters();
    web_server:
      sorting_group_id: group_exposure
      sorting_weight: 1

  - platform: template
    id: cam_aec2
    name: AEC DSP
    icon: mdi:chip
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(bird_camera).set_aec2(true);
          id(bird_camera).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(bird_camera).set_aec2(false);
          id(bird_camera).update_camera_parameters();
    web_server:
      sorting_group_id: group_exposure
      sorting_weight: 2

  - platform: template
    id: cam_auto_gain
    name: Auto Gain
    icon: mdi:signal-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(bird_camera).set_agc_mode(esp32_camera::ESP32_GC_MODE_AUTO);
          id(bird_camera).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(bird_camera).set_agc_mode(esp32_camera::ESP32_GC_MODE_MANU);
          id(bird_camera).update_camera_parameters();
    web_server:
      sorting_group_id: group_exposure
      sorting_weight: 5

button:
  - platform: template
    name: Run Inference Now
    icon: mdi:play
    on_press:
      - vision.inference:
          id: bird_vision
    web_server:
      sorting_group_id: group_detection
      sorting_weight: 6

  - platform: template
    name: Reapply Camera Settings
    icon: mdi:refresh
    entity_category: config
    on_press:
      - script.execute: apply_camera_settings
    web_server:
      sorting_group_id: group_image
      sorting_weight: 6

  - platform: restart
    name: Restart
    entity_category: config
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 4

# XIAO ESP32-S3 user LED (inverted): lit while a detection is being reported
light:
  - platform: status_led
    id: user_led
    pin:
      number: GPIO21
      inverted: true
    internal: true

# --- MQTT alternative -------------------------------------------------------
# If you prefer a broker over direct Convex ingestion, enable this block and
# replace the http_request.post in report_bird with the mqtt.publish_json
# below. MQTT gives you QoS/retain and a free liveness signal (birth/LWT on
# <name>/status). The api: block can stay; both coexist.
#
# mqtt:
